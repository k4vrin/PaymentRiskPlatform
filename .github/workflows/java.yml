name: Java

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-orchestrator-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate
        run: ./mvnw -DskipTests validate
      - name: Test
        run: ./mvnw test
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: java-surefire-reports
          path: services/payment-orchestrator-service/target/surefire-reports/
