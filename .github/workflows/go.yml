name: Go

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/risk-scoring-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/risk-scoring-service/go.mod
          cache-dependency-path: services/risk-scoring-service/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
