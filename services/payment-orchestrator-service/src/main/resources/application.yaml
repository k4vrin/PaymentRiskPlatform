spring:
  application:
    name: payment-orchestrator-service
payment-risk:
  rabbitmq:
    callback:
      enabled: false
      exchange: partner.callback.exchange
      queue: partner.callback.commands
      dead-letter-queue: partner.callback.commands.dlq
      routing-key: partner.callback.command
      max-attempts: 3
      command-producer-consumer-name: partner-callback-command-producer
      expected-schema-version: "v1"
      target-url-template: http://localhost:8080/partner-callbacks/{merchantId}
  kafka:
    topics:
      payment-authorization-requested: payment.authorization.requested
      risk-score-completed: risk.score.completed
      payment-authorization-completed: payment.authorization.completed
      payment-reversal-completed: payment.reversal.completed
      platform-dead-letter-recorded: platform.dead-letter.recorded
    topic-admin:
      enabled: false
      partitions: 1
      replicas: 1
    consumers:
      payment-audit:
        enabled: false
        consumer-name: payment-audit-consumer
        expected-schema-version: "v1"
      settlement-projection:
        enabled: false
        consumer-name: settlement-projection-consumer
        expected-schema-version: "v1"
      ops-metrics:
        enabled: false
        consumer-name: ops-metrics-consumer
        expected-schema-version: "v1"
  outbox:
    relay:
      enabled: false
      batch-size: 50
      fixed-delay-millis: 5000
      instance-id: ${HOSTNAME:payment-orchestrator-service}
      max-attempts: 5
      initial-backoff-millis: 1000
      max-backoff-millis: 60000
