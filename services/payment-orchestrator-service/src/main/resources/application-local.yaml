spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/payment_risk
    username: payment_risk
    password: payment_risk
  flyway:
    url: jdbc:postgresql://localhost:5432/payment_risk
    user: payment_risk
    password: payment_risk
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  rabbitmq:
    host: localhost
    port: 5672
    username: payment_risk
    password: payment_risk
  security:
    user:
      name: dev
      password: dev-pass
      roles:
        - ADMIN
        - MERCHANT
        - OPS
        - AUDITOR
        - SERVICE

payment:
  risk:
    grpc:
      host: localhost
      port: 9090
      timeout: 500ms
  sensitive-data:
    hash-key: ${PAYMENT_SENSITIVE_DATA_HASH_KEY:local-development-sensitive-data-hash-key}

payment-risk:
  security:
    api-key:
      hashing:
        pepper: ${PAYMENT_RISK_API_KEY_HASHING_PEPPER:local-development-api-key-hashing-pepper}
  kafka:
    topic-admin:
      enabled: ${PAYMENT_RISK_KAFKA_TOPIC_ADMIN_ENABLED:false}
      partitions: ${PAYMENT_RISK_KAFKA_TOPIC_PARTITIONS:1}
      replicas: ${PAYMENT_RISK_KAFKA_TOPIC_REPLICAS:1}
