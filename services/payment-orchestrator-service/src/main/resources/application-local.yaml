spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/payment_risk
    username: payment_risk
    password: payment_risk
  flyway:
    url: jdbc:postgresql://localhost:5432/payment_risk
    user: payment_risk
    password: payment_risk
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  rabbitmq:
    host: localhost
    port: 5672
    username: payment_risk
    password: payment_risk
  security:
    user:
      name: dev
      password: dev-pass
      roles:
        - ADMIN
        - MERCHANT
        - OPS
        - AUDITOR
        - SERVICE

payment:
  risk:
    grpc:
      host: localhost
      port: 9091
      timeout: 500ms
  sensitive-data:
    hash-key: ${PAYMENT_SENSITIVE_DATA_HASH_KEY:local-development-sensitive-data-hash-key}

payment-risk:
  security:
    api-key:
      hashing:
        pepper: ${PAYMENT_RISK_API_KEY_HASHING_PEPPER:local-development-api-key-hashing-pepper}
    jwt:
      issuer: ${PAYMENT_RISK_JWT_ISSUER:http://localhost:8080}
      audience: ${PAYMENT_RISK_JWT_AUDIENCE:payment-risk-platform}
      secret: ${PAYMENT_RISK_JWT_SECRET:local-development-jwt-secret-must-be-at-least-32-bytes}
      allowed-origins:
        - ${PAYMENT_RISK_CORS_ORIGIN_LOCALHOST_3000:http://localhost:3000}
        - ${PAYMENT_RISK_CORS_ORIGIN_LOCALHOST_5173:http://localhost:5173}
        - ${PAYMENT_RISK_CORS_ORIGIN_LOCALHOST_8080:http://localhost:8080}
      allowed-methods:
        - GET
        - POST
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-API-Key
        - X-Correlation-Id
        - Idempotency-Key
        - authorization
        - content-type
        - x-api-key
        - x-correlation-id
        - idempotency-key
        - Authorization,X-Correlation-Id
    rate-limit:
      enabled: ${PAYMENT_RISK_RATE_LIMIT_ENABLED:true}
      merchant-limit: ${PAYMENT_RISK_RATE_LIMIT_MERCHANT_LIMIT:120}
      window: ${PAYMENT_RISK_RATE_LIMIT_WINDOW:1m}
      path-prefix: /api/v1/payments
  kafka:
    topic-admin:
      enabled: ${PAYMENT_RISK_KAFKA_TOPIC_ADMIN_ENABLED:false}
      partitions: ${PAYMENT_RISK_KAFKA_TOPIC_PARTITIONS:1}
      replicas: ${PAYMENT_RISK_KAFKA_TOPIC_REPLICAS:1}
