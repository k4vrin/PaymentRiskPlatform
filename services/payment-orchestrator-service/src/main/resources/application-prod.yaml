spring:
  r2dbc:
    url: ${PAYMENT_RISK_R2DBC_URL}
    username: ${PAYMENT_RISK_DB_USERNAME}
    password: ${PAYMENT_RISK_DB_PASSWORD}
  flyway:
    url: ${PAYMENT_RISK_FLYWAY_JDBC_URL}
    user: ${PAYMENT_RISK_DB_USERNAME}
    password: ${PAYMENT_RISK_DB_PASSWORD}
  data:
    redis:
      host: ${PAYMENT_RISK_REDIS_HOST}
      port: ${PAYMENT_RISK_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${PAYMENT_RISK_KAFKA_BOOTSTRAP_SERVERS}
  rabbitmq:
    host: ${PAYMENT_RISK_RABBITMQ_HOST}
    port: ${PAYMENT_RISK_RABBITMQ_PORT:5672}
    username: ${PAYMENT_RISK_RABBITMQ_USERNAME}
    password: ${PAYMENT_RISK_RABBITMQ_PASSWORD}

payment:
  risk:
    grpc:
      host: ${PAYMENT_RISK_GRPC_HOST}
      port: ${PAYMENT_RISK_GRPC_PORT:9090}
      timeout: ${PAYMENT_RISK_GRPC_TIMEOUT:500ms}
  sensitive-data:
    hash-key: ${PAYMENT_SENSITIVE_DATA_HASH_KEY}

payment-risk:
  kafka:
    topics:
      payment-authorization-requested: ${PAYMENT_RISK_KAFKA_TOPIC_PAYMENT_AUTHORIZATION_REQUESTED}
      risk-score-completed: ${PAYMENT_RISK_KAFKA_TOPIC_RISK_SCORE_COMPLETED}
      payment-authorization-completed: ${PAYMENT_RISK_KAFKA_TOPIC_PAYMENT_AUTHORIZATION_COMPLETED}
      payment-reversal-completed: ${PAYMENT_RISK_KAFKA_TOPIC_PAYMENT_REVERSAL_COMPLETED}
      platform-dead-letter-recorded: ${PAYMENT_RISK_KAFKA_TOPIC_PLATFORM_DEAD_LETTER_RECORDED}
    topic-admin:
      enabled: ${PAYMENT_RISK_KAFKA_TOPIC_ADMIN_ENABLED:false}
      partitions: ${PAYMENT_RISK_KAFKA_TOPIC_PARTITIONS:3}
      replicas: ${PAYMENT_RISK_KAFKA_TOPIC_REPLICAS:3}
